server {
    listen 80;

    root /usr/share/nginx/html;
    index index.html;

    # Serve index.html for all routes (SPA routing)
    location / {
        try_files $uri /index.html;
    }

    # Optional: handle static assets caching
    location /static/ {
        expires 1y;
        add_header Cache-Control "public";
    }

    error_page 404 /index.html;
}
